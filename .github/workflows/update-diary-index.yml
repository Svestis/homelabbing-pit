name: Update diary index

on:
  push:
    branches:
      - main
    paths:
      - "diary/20[0-9][0-9]/[0-9][0-9]/*.md"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-diary-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate diary index
        run: |
          echo "=== Diary files ==="
          find diary -type f -name "*.md" -print

          echo ""
          echo "=== Running generator ==="
          python3 scripts/update-diary-index.py

          echo ""
          echo "=== Generated README ==="
          cat diary/README.md

          echo ""
          echo "=== Git diff ==="
          git diff -- diary/README.md

      - name: Commit diary index
        run: |
          if git diff --quiet diary/README.md; then
            echo "Diary index is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add diary/README.md
          git commit -m "docs: update diary index"
          git push