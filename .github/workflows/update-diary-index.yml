name: Update diary index

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-diary-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate diary index
        run: python3 scripts/update-diary-index.py

      - name: Commit diary index
        run: |
          if git diff --quiet diary/README.md; then
            echo "Diary index rebuilt — no changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add diary/README.md
          git commit -m "docs: rebuild diary index"
          git push